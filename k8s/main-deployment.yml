apiVersion: apps/v1
kind: Deployment
metadata:
  name: skaffold-deployment
spec:
  selector:
    matchLabels:
      app: skaffold-server
  replicas: 3
  template:
    metadata:
      labels:
        app: skaffold-server
    spec:
      containers:
      - name: skaffold-server
        image: skaffold-main-server:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
          requests:
            memory: "64Mi"
            cpu: "250m"