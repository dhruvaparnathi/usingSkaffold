apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: skaffold-mern-app

# ── Build ──────────────────────────────────────────
build:
  local:
    push: false        # use local images, don't push to registry
  artifacts:

    - image: skaffold-main-server
      context: ./Backend/main-server      # build context = ./core folder
      docker:
        dockerfile: dockerfile
      sync:
        manual:             # paths are relative to ./core context
          - src: '**/*.js'     # NOT 'core/**/*.js' ← that would fail
            dest: /app
          - src: '**/*.json'
            dest: /app

    - image: notification-skaffold
      context: ./Backend/notifications
      docker:
        dockerfile: dockerfile
      sync:
        manual:
          - src: '**/*.js'
            dest: /app
          - src: '**/*.json'
            dest: /app

# ── Manifests ──────────────────────────────────────
manifests:
  rawYaml:
    - k8s/main-deployment.yml
    - k8s/notification-deployment.yml
    - k8s/main-service.yml
    - k8s/notification-service.yml
    - k8s/ingress.yml

# ── Port Forwarding ────────────────────────────────
portForward:
  - resourceType: service
    resourceName: skaffold-service
    port: 80
    localPort: 3000
  - resourceType: service
    resourceName: notification-service
    port: 80
    localPort: 4000